services:
  postgres:
    image: postgres:16-alpine
    container_name: website-creator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: website_creator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d website_creator"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
